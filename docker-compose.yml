version: '3.8'

services:
  frontend:
    build: .
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/database.sqlite
    volumes:
      - ./server/database.sqlite:/app/database.sqlite
    networks:
      - app-network

networks:
  app-network:
    driver: bridge 