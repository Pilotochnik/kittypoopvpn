# Поддомен для VPN-сервера (vpn.kittypoopvpn.com)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vpn.kittypoopvpn.com;

    ssl_certificate /etc/letsencrypt/live/kittypoopvpn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kittypoopvpn.com/privkey.pem;
    
    # Оптимизированные настройки SSL для мобильных сетей
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Увеличенные таймауты для стабильной работы через мобильные сети
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    location / {
        proxy_pass http://localhost:10086;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Дополнительные заголовки для улучшения работы через мобильные сети
        proxy_set_header Early-Data $ssl_early_data;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Буферизация для стабильной работы
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        # Отключаем ограничения на размер тела запроса
        client_max_body_size 0;
        
        # Держим соединение открытым
        keepalive_timeout 65;
        keepalive_requests 100;
    }
    
    # Дополнительные настройки безопасности
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
} 